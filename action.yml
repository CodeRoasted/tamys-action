name: 'Tamys — structural CI-log diff'
description: 'Diffs one job''s CI log against the last green run on the base branch; posts one sticky PR comment + an advisory gate.'
author: 'CodeRoast'
branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  target-job:
    description: >-
      Zero-plumbing log sourcing: the NAME of a finished job in this run whose log Tamys diffs — no
      tee/capture shell needed in the build job. Run Tamys in a separate job that `needs:` the target
      (the API serves logs for completed jobs only; the target's own conclusion then also gives you
      `changed-outcome` for free). The log is diffed as the bytes GitHub serves, its byte-order mark
      and per-line timestamps declared to the engine, which peels them; `capture` selects marked
      sections, whole lines byte for byte. Mutually exclusive with `log` (target-job wins). Like
      `log`, passes the workflow's declared job graph when it can be read (see `log`): it frames
      each row by its own job's declared conclusion, and a failed job's row names the step the
      listing declares failed (the Action declares which job and attempt the log is). No fold row
      comes of it, since a fold needs rows from two jobs and this source diffs one.
    required: false
    default: ''
  capture:
    description: >-
      With `target-job`: which part of the job log to diff. `auto` (default) — if the log contains
      TAMYS_CAPTURE sections use them all, else the whole job log. `off` — the whole job log always.
      `<name>` — only the sections opened with `TAMYS_CAPTURE <name>` (absent ⇒ the run fails: config
      error). Sections are plain echoed lines: `echo "TAMYS_CAPTURE ci"` … `echo "TAMYS_CAPTURE_END"`.
    required: false
    default: 'auto'
  log:
    description: >-
      Path to the current run's captured log to diff (the build/CI log). Required for mode
      comment|render unless `target-job` is set; unused for mode post. The Action also passes the
      workflow's declared job graph, read at the commit this run executed with the `contents: read`
      permission, and this run's jobs listing: the engine frames each row by its job's declared
      conclusion and can fold a red aggregator job into the member that failed. A fold row appears
      only when the file holds several jobs' logs.
    required: false
    # Override only. By default the Action downloads + sha256-verifies the
    # version-pinned `tamys-linux-x64` release asset (resolve-tamys.ts). Set this to
    # a path for a self-hosted runner / in-image build / Docker-bundle packaging.
  tamys-binary:
    description: 'Override path to a `tamys` binary. Default: download + verify the version-pinned linux-x64 release asset.'
    required: false
    default: 'tamys'
  fail-on:
    description: 'Fail this step when Tamys reports a change that got worse at this severity or above: none (default, never fails) | medium | high | critical. Any other value fails the run (config error).'
    required: false
    default: 'none'
  baseline:
    description: >-
      Baseline SELECTION — you are King of the baseline. One of:
      `auto` (default) — the last green run of this workflow on the PR's base branch (push: the pushed
      branch; tag: the repo default branch), pulling its `baseline-name` artifact — the turnkey
      zero-config path. `branch=<name>` — same resolver, explicit branch. `artifact=<name>` — the
      newest non-expired artifact with that exact name, repo-wide, established by reading every
      artifact of that name (100 per request, at most 1000; past that, or if the listing changes
      while it is read, a cold start that says why): NAMED baselines (a main-seeded
      `tamys-baseline-main-build`, a per-PR `tamys-baseline-build-pr-123`) resolve from ANY event — tags
      and PRs included, no need for this workflow to have run on that branch. `path=<file>` — a local
      file (self-hosted / bring-your-own). `none` — forced cold start (seed-only runs). A malformed
      value fails the run (config error), never falls back silently.
    required: false
    default: 'auto'
  baseline-name:
    description: >-
      The artifact name this run PUBLISHES its ingested log under (the `create_baseline` half), and
      the artifact name the `auto`/`branch=` resolvers look for on the resolved run. Leave it unset
      (the default) and the name is DERIVED from the job this run diffs, so each job that runs Tamys
      keeps its own baseline lineage with no input: `tamys-baseline-<slug>-<digest>`, the slug read
      off the job's rendered name (its reusable-call prefix and matrix values included), the
      `capture` section and the `comment-tag`, the digest the first 16 hex of SHA-256 over them. The
      derived name is printed in the log. Set it to pin a name of your own, used verbatim. A
      stored baseline records its job, and only this job's entry of the name is diffed: when two
      jobs share a name, each finds its own, newest first, with a warning; when none of the run's
      entries is this job's, the run is a cold start that says so. Give each job that runs Tamys
      its own `baseline-name`, or leave it unset so each job derives its own; a matrix job whose
      `name:` is a literal needs the matrix value in its `name:` or in `baseline-name`.
    required: false
    default: ''
  publish-baseline:
    description: >-
      When this run publishes `baseline-name`: `auto` (default — PRs always seed; pushes/tags are
      green-gated: a red build never overwrites the last-green baseline) | `always` | `never`.
    required: false
    default: 'auto'
  baseline-max-age:
    description: >-
      Staleness bound on the resolved baseline: `<n>h` or `<n>d` (e.g. `72h`, `7d`). Default `72h`;
      empty disables the bound. The green-gated re-seed means a long red streak ages the baseline
      without limit, degrading every diff exactly when it is most needed — this bound makes that
      visible instead of silent. Exceeding it is a WARNING, never a failure: the run still diffs,
      posts and seeds (an aged comparison is information) and announces itself with a STALE banner
      in the comment plus a warning annotation, while the step's exit code stays with `fail-on`
      alone. Raise it to match your cadence — a repo that ships weekly is not misconfigured, and
      `72h` is only the bound that fits a near-daily trunk. The baseline's age is always in the
      comment footer and the `baseline-age-hours` output, bound or no bound. A malformed value
      fails the run (config error).
    required: false
    default: '72h'
  comment-tag:
    description: >-
      Optional namespace for the sticky PR comment (appended to the hidden marker and the title), so
      two tamys invocations in one job — e.g. vs-main and vs-previous-run — each keep their own
      comment. Leave unset for the single-comment default.
    required: false
    default: ''
  explain-api-key:
    description: >-
      The model provider's API key, from a secret (for example the ANTHROPIC_API_KEY secret). Non-empty:
      one narration call per run, adding a short AI-generated story above the ranked changes. Empty
      (the default): the structural report alone. Only Tamys's bounded summary is sent, never a log
      line; the key is masked in the log, never put on a command line, and never seen by the process
      that parses your logs. Not used in `render` mode. The narrative is advisory and fail-soft: it
      never changes the ranking, the gate or an output.
    required: false
    default: ''
  explain-model:
    description: >-
      The model named in the narration request. The default is Claude Haiku 5.5; another Claude model
      also runs at medium effort.
    required: false
    default: 'claude-haiku-5-5'
  explain-endpoint:
    description: >-
      Where the narration request goes: Anthropic's Messages API by default. For another provider, its
      OpenAI-compatible `/chat/completions` URL over https.
    required: false
    default: 'https://api.anthropic.com/v1/messages'
  changed-outcome:
    description: >-
      The current run's NATIVE CI verdict token, forwarded VERBATIM to the engine
      (`--changed-outcome`), which maps it class-aware (SUCCESS | FAILURE | UNSTABLE | ABORTED | CANCELLED)
      through its dialect vocabulary — this drives the verdict headline, the outcome-regression
      check, and the verdict-gated baseline re-seed. `auto` (default): the target job's own API
      conclusion when `target-job` is set — zero plumbing; without `target-job` set it explicitly
      from a needs.<job>.result expression, else the engine falls back to the log's console tail /
      no verdict.
    required: false
    default: 'auto'
  pr-comment:
    description: >-
      PR runs: post the sticky comment when the verdict is at least this level —
      never | regression (only a flagged regression) | drift (drift OR regression) |
      always (every state, incl. the green "no change" reassurance). Default `always`.
      Any other value fails the run (config error). The job summary + outputs are written regardless.
    required: false
    default: 'always'
  commit-comment:
    description: >-
      Push runs (no PR — e.g. trunk commits to main): ALSO post a comment on the pushed commit when
      the verdict is at least this level — never (default; job summary only) | regression | drift
      (drift OR regression) | always; any other value fails the run. NEVER fires below the level (a
      clean run stays quiet), upserts per-commit (re-runs don't duplicate). Needs `contents: write`;
      degrades to a warning without it.
    required: false
    default: 'never'
  annotations:
    description: >-
      Inline check-run annotations: emit a `::error|warning|notice::` workflow command for each
      significant row when the verdict is at least this level — never (default) | regression
      (regressions only) | drift (drift OR regression) | always; any other value fails the run. OFF
      by default because the PR comment and the job summary already render the same result, and an
      annotation competes with the compiler's own in the gutter where a real build error must stay
      findable — opt in with `annotations: drift` and the surface is whole. When on they surface in the Checks
      tab / PR checks strip, fire on a GREEN build (where GitHub's failure-explain is silent), and
      need NO write token, so a fork PR's unprivileged build (mode=render) annotates fork-safely.
      Polarity drives the level: regression → error, recovery → notice, other significant → warning.
    required: false
    default: 'never'
  github-token:
    description: 'Token for the runs/artifacts API, the sticky comment, and artifact upload.'
    required: false
    default: ${{ github.token }}
  mode:
    description: >-
      comment (default) — render + post the sticky comment inline (same-repo PRs,
      the proven path). render — render the escaped comment body to
      $RUNNER_TEMP/tamys-comment/ WITHOUT posting (the unprivileged fork build job;
      the workflow uploads it as the `tamys-comment` artifact). post — run no engine;
      download that artifact off the triggering run and post the comment (the
      privileged workflow_run job). See examples/fork-safe/. Leave unset (comment)
      unless you have wired the fork-comment topology.
    required: false
    default: 'comment'
  run-id:
    description: 'mode=post only: the triggering run id whose `tamys-comment` artifact to post — the workflow_run event''s run id (see examples/fork-safe).'
    required: false
    default: ''
  build-workflow:
    description: 'mode=post only (optional): the expected build workflow (file name or display name) to double-check the triggering run against. The workflow_run trigger filter is the primary guard.'
    required: false
    default: ''

# Machine-readable verdict — set on EVERY run regardless of the comment config, so a later step can
# branch on Tamys's result (e.g. `if: steps.tamys.outputs.state == 'regression'`) without parsing text.
outputs:
  state:
    description: 'Verdict: cold-start | clean | drift | regression.'
  total-changes:
    description: 'Total observed deltas (the "of N" number, before significance suppression).'
  significant-changes:
    description: 'Deltas that cleared the significance floor.'
  regression:
    description: 'true when a regression was flagged (a regression row OR a run-verdict regression), else false.'
  baseline-outcome:
    description: 'The baseline run''s engine-resolved verdict: SUCCESS | FAILURE | UNSTABLE | ABORTED | CANCELLED | UNKNOWN.'
  changed-outcome:
    description: 'This run''s engine-resolved verdict: SUCCESS | FAILURE | UNSTABLE | ABORTED | CANCELLED | UNKNOWN.'
  outcome-regressed:
    description: 'true when the run verdict got strictly worse (Success < Unstable < Failure; Aborted/Cancelled/Unknown excluded).'
  baseline-age-hours:
    description: 'Resolved baseline''s age in whole hours, from when its artifact was stored. Empty when unknown (cold start, a path= baseline, a pre-sidecar artifact) — never 0-for-unknown.'
  baseline-stale:
    description: 'true when a `baseline-max-age` bound is in force and the resolved baseline exceeds it, else false. Advisory — it never fails the step.'
  report-path:
    description: >-
      Filesystem path to this run's deterministic report.json on a stable, cross-step
      location ($RUNNER_TEMP/tamys-report.json). Empty on cold start (no baseline ⇒ no
      report). A later step on the SAME runner can narrate it with
      `tamys explain --report <path>` — the same content already in the comment/summary;
      no credential (contract § 3.6). The same report is also uploaded on every run that has one
      as the `tamys-report-<slug>-<digest>-<run attempt>` workflow artifact, named over the same key
      as the derived baseline name plus the run attempt, which the comment points at wherever it
      shows a row or the full report cut to GitHub's size limit.

# Permissions the caller workflow must grant (contract § 6):
#   actions: read       — read this run's jobs listing (which names the job this run diffs, and
#                         so its baseline lineage), resolve the base branch's last green run + its
#                         artifact. Without it no baseline is read or published.
#   pull-requests: write — post/update the sticky comment (PR runs)
#   actions: write      — upload this run's baseline-log artifact
# The `tamys-report-*` artifact is uploaded through the same @actions/artifact client as the
# baseline-log artifact (the runner's runtime token, not `github-token`), in the fork
# `render` job too.
#   contents: write     — ONLY if commit-comment is set (push-mode commit comments); else omit
# Not requested by the documented workflows: `contents: read`. With it, the Action reads the
# workflow file at the commit this run executed, and the baseline run's at the commit THAT run
# executed (only for an event whose run names it: push, workflow_dispatch, schedule, issues,
# workflow_run, merge_group), for the two declared job graphs, on every run: each job's declared
# conclusion frames that job's rows, each side's step banners are matched to its own declared
# steps, with `target-job` a listed step declared failed is named on its job's row, and the
# aggregator fold can fire when a `log:` file holds several jobs' logs.
# Without the grant the read may be refused: the log says so, and the diff runs without the graph.
# Fork PRs get a read-only token: the comment/artifact writes degrade with a
# warning (the advisory gate still applies).

runs:
  using: 'node24'
  main: 'dist/index.js'
